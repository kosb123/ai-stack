services:
  db:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${LOCAL_SECRET}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    image: ghcr.io/paperclipai/paperclip:latest
    # No `init: true` here on purpose. The image makes tini PID 1 itself
    # (Dockerfile ENTRYPOINT), which covers every launch path -- compose, plain
    # `docker run`, the quadlet units and the ECS task definition -- instead of
    # one lever per orchestrator. Setting it here too would nest docker-init
    # around tini and make tini warn that it is not PID 1 on every boot.
    # pids_limit is the backstop: if something ever does leak processes again,
    # this container hits its own ceiling and dies visibly rather than starving
    # the whole host of pids.
    pids_limit: 2048
    mem_limit: 3072m
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      DATABASE_URL: ${LOCAL_SECRET}
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: ${LOCAL_SECRET}
      # Independent secret for signed approval-gated tool actions.
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${LOCAL_SECRET}
    volumes:
      - paperclip-data:/paperclip
      # Only this folder is shared with agents; never mount all of E:.
      - E:/projects:/workspace
    depends_on:
      db:
        condition: service_healthy

  # Hermes runs on Windows. Sharing the server's network gives it a loopback
  # address, because agent verification rejects plain HTTP to any other host.
  hermes-relay:
    image: ghcr.io/paperclipai/paperclip:latest
    network_mode: "service:server"
    mem_limit: 64m
    entrypoint:
      - node
      - -e
      - |
        const net = require("net");
        net.createServer((client) => {
          const hermes = net.connect(8642, "host.docker.internal");
          client.pipe(hermes).pipe(client);
          client.on("error", () => hermes.destroy());
          hermes.on("error", () => client.destroy());
        }).listen(8642, "127.0.0.1");
    depends_on:
      - server

volumes:
  pgdata:
  paperclip-data:
