name: Verify repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_repo.py .
      - run: python hermes/plugins/pstack/scripts/check_refs.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s omniroute/autotune -p test_preferred.py -v
      - run: python -m unittest discover -s omniroute/dashboard -p test_dashboard.py -v
      - run: python -m unittest discover -s skills/verify-hermes-stack/scripts -p test_verifier.py -v
