_config_version: 51
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
attachments:
  storage: hermes-home
plugins:
  clone_timeout_seconds: 300
  enabled:
  - disk-cleanup
  - pstack
  - rtk-rewrite
  - orca-status
  disabled: []
model:
  default: hermes-fast-agent
  provider: custom:omni
  base_url: http://127.0.0.1:20128/v1
  api_mode: chat_completions
kanban:
  review_dispatch: true
  max_in_progress: 2
  failure_limit: 3
  orchestrator_profile: ''
  default_assignee: ''
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  client_env_passthrough:
  - ORCA_AGENT_PANE
  - ORCA_AGENT_LAUNCH
  - ORCA_TAB_ID
  - ORCA_WORKTREE_ID
  - ORCA_AGENT_HOOK_ENDPOINT
  - ORCA_AGENT_HOOK_ENV
  - ORCA_AGENT_HOOK_VERSION
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  use_real_profile: true
  cloud_provider: nous
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: true
  threshold: 0.8
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 3
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: null
  protect_first_n: 3
  idle_compact_after_seconds: 3600
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 30000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  micro_compact: false
  threshold_tokens: 96000
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
max_concurrent_sessions: null
group_sessions_per_user: true
streaming:
  enabled: true
skills:
  creation_nudge_interval: 15
  external_dirs:
  - C:/Users/jun/AppData/Local/hermes/shared-skills
  - C:/Users/jun/AppData/Local/hermes/plugins/pstack/skills
  disabled:
  - requesting-code-review
  - subagent-driven-development
  - systematic-debugging
  - test-driven-development
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: low
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
  reasoning_overrides:
    hermes-fast-agent: low
    Qwen3.8-27B-UD-Q4_K_M: low
    auto/best-chat: low
    auto/best-coding: low
    auto/best-reasoning: low
    auto/fast: low
    auto/best-vision: low
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes:
  - name: blog-channel
    platform: discord
    guild_id: '1556874780085588079'
    chat_id: '1561958129611186276'
    profile: blog
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
platform_toolsets:
