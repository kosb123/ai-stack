  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
    timeout: 60
    max_retries: 1
  provider: nous
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
  max_concurrent_children: 3
  reasoning_effort: low
display:
  compact: false
  cleanup_progress: false
  suppress_warning_notifications: false
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  streaming: true
  skin: default
  language: ko
  platforms:
    discord:
      tool_progress: all
      show_reasoning: true
  tool_progress_command: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
updates:
  check: true
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
local_runtime:
  enabled: false
approvals:
  mode: 'off'
  deny:
  - sudo *
  - '*authorized_keys*'
  - '*curl*|*sh*'
  - '*wget*|*sh*'
  - '*irm*|*iex*'
  - '*iwr*|*iex*'
  - git push --force*
  - git push -f*
  - rm -rf /*
  - format *
  - '*Remove-Item*-Recurse*C:\*'
model_aliases:
  omni:
    model: hermes-fast-agent
    provider: custom
    base_url: http://127.0.0.1:20128/v1
    key_env: OMNIROUTE_API_KEY
  omni-coding:
    model: auto/chat:reliable
    provider: custom
