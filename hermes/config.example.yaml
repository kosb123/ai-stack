      key_env: OMNIROUTE_API_KEY
      model: gemini/gemini-3.1-flash-lite
    - provider: custom
      base_url: http://127.0.0.1:3001/v1
      key_env: FREELLMAPI_API_KEY
      model: auto:hermes
  title_generation:
    provider: auto
    model: ''
    timeout: 30
    model_upgrade_enabled: false
  background_review:
    provider: custom
    base_url: http://127.0.0.1:20128/v1
    key_env: OMNIROUTE_API_KEY
    model: gemini/gemini-3.1-flash-lite
    timeout: 300
    reasoning_effort: low
    max_input_tokens: 48000
    fallback_chain:
    - provider: custom
      base_url: http://127.0.0.1:20128/v1
      key_env: OMNIROUTE_API_KEY
      model: antigravity/gemini-3.1-flash-lite
    - provider: custom
      base_url: http://127.0.0.1:20128/v1
      key_env: OMNIROUTE_API_KEY
      model: hermes-fast-agent
  mcp:
    provider: auto
    model: ''
  approval:
    provider: auto
    model: ''
    timeout: 60
    fallback_chain:
    - provider: custom
      base_url: http://127.0.0.1:20128/v1
      key_env: OMNIROUTE_API_KEY
      model: antigravity/gemini-3.1-flash-lite
    - provider: custom
      base_url: http://127.0.0.1:20128/v1
      key_env: OMNIROUTE_API_KEY
      model: hermes-fast-agent
providers:
  llamacpp:
    name: llama.cpp (Qwen3.8 27B)
    base_url: http://127.0.0.1:18434/v1
    api_key: ${LOCAL_SECRET}
    default_model: Qwen3.8-27B-UD-Q4_K_M
    api_mode: chat_completions
    models:
      Qwen3.8-27B-UD-Q4_K_M:
        context_length: 163840
  omni:
    name: omni
    base_url: http://127.0.0.1:20128/v1
    key_env: OMNIROUTE_API_KEY
    default_model: hermes-fast-agent
    discover_models: false
    models:
    - hermes-fast-agent
    api_mode: chat_completions
    extra_headers:
      x-omniroute-no-memory: 'true'
    stale_timeout_seconds: 360
  custom:
    name: custom
    base_url: http://127.0.0.1:20128/v1
    key_env: OMNIROUTE_API_KEY
    default_model: hermes-fast-agent
    discover_models: false
    models:
    - hermes-fast-agent
    api_mode: chat_completions
    extra_headers:
      x-omniroute-no-memory: 'true'
    stale_timeout_seconds: 360
  freellmapi:
    name: freellmapi
    base_url: http://127.0.0.1:3001/v1
    key_env: FREELLMAPI_API_KEY
    default_model: auto:hermes
    api_mode: chat_completions
    extra_headers:
      User-Agent: hermes-agent
    context_length: 262144
    models:
      auto:hermes: {}
      auto: {}
