<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRoute 대시보드</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>OmniRoute 대시보드</h1>
    <div class="tabs" id="range-tabs" role="tablist" aria-label="기간">
      <button role="tab" data-range="24h">24시간</button>
      <button role="tab" data-range="7d">7일</button>
      <button role="tab" data-range="30d">30일</button>
      <button role="tab" data-range="all">전체</button>
    </div>
    <div class="top-meta">
      <span id="collected" class="muted">수집 시각 불러오는 중…</span>
      <button id="theme" class="ghost" type="button" aria-label="화면 색상 전환">☾</button>
    </div>
  </div>
</header>

<main>
  <noscript><p class="notice">이 화면은 JavaScript가 필요합니다.</p></noscript>
  <section id="kpi" class="kpis" aria-label="요약"></section>

  <section class="card" id="sec-tokens">
    <h2>토큰 사용량</h2>
    <div id="tokens-body"></div>
  </section>

  <section class="card" id="sec-candidates">
    <h2>후보 <small>콤보에 들어 있는 모델과 autotune이 고른 모델 (최근 24시간 사용량)</small></h2>
    <div id="cand-body"></div>
  </section>

  <section class="card" id="sec-quota">
    <h2>할당량 <small>계정·창별 남은 양</small></h2>
    <div id="quota-body"></div>
  </section>

  <section class="card" id="sec-models">
    <h2>모델별 사용량</h2>
    <div id="models-body"></div>
  </section>

  <section class="card" id="sec-errors">
    <h2>오류 <small>무슨 일이 있었고 어떻게 하면 되는지</small></h2>
    <div id="errors-body"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
